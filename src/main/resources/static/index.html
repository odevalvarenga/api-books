<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Books API</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <header>

        <h1>Books API</h1>

        <p>Gerenciamento de livros</p>

    </header>

    <!-- CRIAR -->

    <div class="card">

        <h2>Novo Livro</h2>

        <input
                type="text"
                id="titulo"
                placeholder="Digite o título do livro"
        >

        <button onclick="criarLivro()">
            Criar Livro
        </button>

    </div>

    <!-- BUSCAR -->

    <div class="card">

        <h2>Pesquisar Livro</h2>

        <input
                type="text"
                id="pesquisa"
                placeholder="Buscar por título"
        >

        <button onclick="buscarLivro()">
            Buscar
        </button>

    </div>

    <!-- LISTA -->

    <div class="card">

        <div class="topo">

            <h2>Lista de Livros</h2>

            <button onclick="carregarLivros()">
                Atualizar
            </button>

        </div>

        <div id="listaLivros"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
